openapi: 3.0.3
info:
  title: Kinlore API
  description: Family moments and milestones tracking API
  version: 1.0.0
  contact:
    name: Kinlore
servers:
  - url: http://localhost:8000/api
    description: Local development
  - url: https://api.kinlore.com/api
    description: Production

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Kids
    description: Child profile management
  - name: Moments
    description: Unified moments (photo, video, story, milestone)
  - name: Media
    description: Raw media file management
  - name: Milestones
    description: Predefined milestone library
  - name: Interactions
    description: Moment likes and comments
  - name: Sync
    description: WatermelonDB synchronization
  - name: Health
    description: Health check endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    Kid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        date_of_birth:
          type: string
          format: date
        avatar_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        age:
          type: string
        age_detailed:
          type: string
        moments_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Moment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        moment_type:
          type: string
          enum: [photo, video, story, milestone]
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: Required for story type, optional for milestone type
        milestone_id:
          type: string
          nullable: true
          description: Reference to predefined_milestones.id (required for milestone type)
        photo_url:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        medium_url:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
        mime_type:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        exif_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [photo, video]
        status:
          type: string
          enum: [uploading, processing, completed, failed]
        original_filename:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        thumbnail_url:
          type: string
          nullable: true
        medium_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Story:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        title:
          type: string
        text:
          type: string
        icon_image_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    PredefinedMilestone:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        stage_key:
          type: string
        stage_label:
          type: string
        category:
          type: string
        sort_order:
          type: integer

    UserMilestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        predefined_milestone_id:
          type: string
          nullable: true
        custom_title:
          type: string
          nullable: true
        custom_description:
          type: string
          nullable: true
        milestone_date:
          type: string
          format: date
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        moment_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [comment]
        content:
          type: string
        user:
          $ref: "#/components/schemas/User"
        created_at:
          type: string
          format: date-time

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

paths:
  # ============================================================================
  # HEALTH
  # ============================================================================
  /health:
    get:
      tags: [Health]
      summary: Basic health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  service:
                    type: string
                    example: kinlore-api

  /health/detailed:
    get:
      tags: [Health]
      summary: Detailed health check
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Detailed health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: object
                  storage:
                    type: object
                  queue:
                    type: object

  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
                      token_type:
                        type: string
        "422":
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke current token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout from all devices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out from all devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      kids_count:
                        type: integer
                      moments_count:
                        type: integer
                      storage_used:
                        type: string
                      storage_bytes_used:
                        type: integer

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      token_type:
                        type: string

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        is_current:
                          type: boolean
                        last_used_at:
                          type: string
                          format: date-time

  /auth/sessions/{tokenId}:
    delete:
      tags: [Auth]
      summary: Revoke specific session
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Token not found

  # ============================================================================
  # KIDS
  # ============================================================================
  /v1/kids:
    get:
      tags: [Kids]
      summary: List kids
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kids list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Kid"

    post:
      tags: [Kids]
      summary: Create kid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, date_of_birth]
              properties:
                name:
                  type: string
                  example: Emma
                date_of_birth:
                  type: string
                  format: date
                  example: "2022-03-15"
                avatar_color:
                  type: string
                  pattern: "^#[0-9A-Fa-f]{6}$"
                  example: "#FF6B6B"
      responses:
        "201":
          description: Kid created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Kid"

  /v1/kids/{kid}:
    get:
      tags: [Kids]
      summary: Get kid details
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Kid details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Kid"

    put:
      tags: [Kids]
      summary: Update kid
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                date_of_birth:
                  type: string
                  format: date
                avatar_color:
                  type: string
      responses:
        "200":
          description: Kid updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Kid"

    delete:
      tags: [Kids]
      summary: Delete kid
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Kid deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ============================================================================
  # UNIFIED MOMENTS
  # ============================================================================
  /v1/moments:
    get:
      tags: [Moments]
      summary: List moments
      security:
        - bearerAuth: []
      parameters:
        - name: kid_id
          in: query
          schema:
            type: string
            format: uuid
        - name: moment_type
          in: query
          schema:
            type: string
            enum: [photo, video, story, milestone]
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Moments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Moment"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

    post:
      tags: [Moments]
      summary: Create moment (unified - photo, video, story, or milestone)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kid_id]
              properties:
                kid_id:
                  type: string
                  format: uuid
                moment_type:
                  type: string
                  enum: [photo, video, story, milestone]
                  description: Auto-detected for file uploads
                file:
                  type: string
                  format: binary
                  description: Required for photo/video types
                title:
                  type: string
                description:
                  type: string
                  description: Required for story type, optional for milestone type
                milestone_id:
                  type: string
                  description: Required for milestone type (references predefined_milestones.id)
                device_asset_id:
                  type: string
                exif_date:
                  type: string
                  format: date-time
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                camera_make:
                  type: string
                camera_model:
                  type: string
                orientation:
                  type: integer
                  minimum: 1
                  maximum: 8
      responses:
        "201":
          description: Moment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      moment:
                        $ref: "#/components/schemas/Moment"
                      media:
                        $ref: "#/components/schemas/Media"
                        description: Only included for photo/video types
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /v1/moments/{moment}:
    get:
      tags: [Moments]
      summary: Get moment details
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Moment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Moment"

    put:
      tags: [Moments]
      summary: Update moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                text:
                  type: string
                  description: For story type
                custom_title:
                  type: string
                  description: For milestone type
                milestone_date:
                  type: string
                  format: date
                notes:
                  type: string
      responses:
        "200":
          description: Moment updated

    delete:
      tags: [Moments]
      summary: Delete moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Moment deleted

  /v1/moments/{moment}/file/{type}:
    get:
      tags: [Moments]
      summary: Serve moment file
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [original, medium, thumbnail, hls]
      responses:
        "200":
          description: File content
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: File not found

  /v1/moments/{moment}/file-status:
    get:
      tags: [Moments]
      summary: Check file status (diagnostic)
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      moment_id:
                        type: string
                      paths:
                        type: object
                      exists:
                        type: object

  /v1/kids/{kid}/moments/uploaded-identifiers:
    get:
      tags: [Moments]
      summary: Get uploaded identifiers for duplicate detection
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Uploaded identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_asset_id:
                          type: string
                        device_fingerprint:
                          type: string
                        file_size:
                          type: integer
                        filename:
                          type: string

  # ============================================================================
  # INTERACTIONS
  # ============================================================================
  /v1/moments/{moment}/like:
    post:
      tags: [Interactions]
      summary: Like a moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Moment liked
        "200":
          description: Already liked

    delete:
      tags: [Interactions]
      summary: Unlike a moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Moment unliked
        "404":
          description: Not liked yet

  /v1/moments/{moment}/comments:
    get:
      tags: [Interactions]
      summary: Get comments for moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"

    post:
      tags: [Interactions]
      summary: Add comment to moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Comment"

  /v1/interactions/{interaction}:
    delete:
      tags: [Interactions]
      summary: Delete comment
      security:
        - bearerAuth: []
      parameters:
        - name: interaction
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment deleted
        "403":
          description: Unauthorized

  # ============================================================================
  # MEDIA (Raw file management)
  # ============================================================================
  /v1/media:
    get:
      tags: [Media]
      summary: List media files
      security:
        - bearerAuth: []
      parameters:
        - name: kid_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [photo, video]
        - name: status
          in: query
          schema:
            type: string
            enum: [uploading, processing, completed, failed]
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Media list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /v1/media/{media}:
    get:
      tags: [Media]
      summary: Get media details
      security:
        - bearerAuth: []
      parameters:
        - name: media
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Media details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Media"

    delete:
      tags: [Media]
      summary: Delete media
      security:
        - bearerAuth: []
      parameters:
        - name: media
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Media deleted

  /v1/media/{media}/file/{type}:
    get:
      tags: [Media]
      summary: Serve media file
      security:
        - bearerAuth: []
      parameters:
        - name: media
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [original, medium, thumbnail, hls]
      responses:
        "200":
          description: File content

  /v1/kids/{kid}/media/uploaded-identifiers:
    get:
      tags: [Media]
      summary: Get uploaded media identifiers for duplicate detection
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Uploaded identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_asset_id:
                          type: string
                        device_fingerprint:
                          type: string
                        file_size:
                          type: integer
                        filename:
                          type: string

  # ============================================================================
  # PREDEFINED MILESTONES
  # ============================================================================
  /v1/milestones/predefined:
    get:
      tags: [Milestones]
      summary: List predefined milestones
      security:
        - bearerAuth: []
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum: [stage, category]
        - name: category
          in: query
          schema:
            type: string
        - name: stage_key
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Predefined milestones
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PredefinedMilestone"

  /v1/milestones/predefined/{id}:
    get:
      tags: [Milestones]
      summary: Get predefined milestone
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Predefined milestone details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PredefinedMilestone"

  # ============================================================================
  # SYNC (WatermelonDB)
  # ============================================================================
  /v1/sync/pull:
    post:
      tags: [Sync]
      summary: Pull changes from server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schemaVersion]
              properties:
                lastPulledAt:
                  type: integer
                  description: Timestamp in milliseconds
                schemaVersion:
                  type: integer
                migration:
                  type: object
      responses:
        "200":
          description: Changes since last pull
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: object
                    properties:
                      kids:
                        type: object
                        properties:
                          created:
                            type: array
                            items:
                              type: object
                          updated:
                            type: array
                            items:
                              type: object
                          deleted:
                            type: array
                            items:
                              type: string
                      moments:
                        type: object
                      milestones:
                        type: object
                  timestamp:
                    type: integer
                    description: Server timestamp in milliseconds

  /v1/sync/push:
    post:
      tags: [Sync]
      summary: Push changes to server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: object
                  properties:
                    kids:
                      type: object
                      properties:
                        created:
                          type: array
                        updated:
                          type: array
                        deleted:
                          type: array
                lastPulledAt:
                  type: integer
      responses:
        "200":
          description: Changes applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
