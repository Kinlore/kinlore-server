  # ============================================================================
  # PREDEFINED MILESTONES
  # ============================================================================
  /v1/milestones:
    get:
      tags: [Milestones]
      summary: List all milestones
      security:
        - bearerAuth: []
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum: [stage, category]
        - name: category
          in: query
          schema:
            type: string
        - name: stage_key
          in: query
          schema:
            type: string
        - name: flat
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Milestones list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Milestone"

  /v1/milestones/{id}:
    get:
      tags: [Milestones]
      summary: Get milestone details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Milestone details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Milestone"

  # ============================================================================
  # INVITATIONS (admin only)
  # ============================================================================
  /v1/invitations:
    get:
      tags: [Invitations]
      summary: List pending invitations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending (unused, unexpired) invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "403":
          description: Not the instance admin
    post:
      tags: [Invitations]
      summary: Create an invitation
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Optional. Locks the invitation to this email.
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 7
      responses:
        "201":
          description: Invitation created. The token is shown only in this response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Invitation"
                      - type: object
                        properties:
                          token:
                            type: string
                          invite_link:
                            type: string
                            example: kinlore://invite/abc123
        "403":
          description: Not the instance admin
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /v1/invitations/{invitation}:
    delete:
      tags: [Invitations]
      summary: Revoke an unused invitation
      security:
        - bearerAuth: []
      parameters:
        - name: invitation
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation revoked
        "403":
          description: Not the instance admin
        "409":
          description: Invitation was already used

  # ============================================================================
  # USER
  # ============================================================================
  /v1/user:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ============================================================================
  # SYNC (WatermelonDB)
  # ============================================================================
  /v1/sync/pull:
    post:
      tags: [Sync]
      summary: Pull changes from server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schemaVersion]
              properties:
                lastPulledAt:
                  type: integer
                  description: Timestamp in milliseconds
                schemaVersion:
                  type: integer
                migration:
                  type: object
      responses:
        "200":
          description: Changes since last pull
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: object
                    properties:
                      kids:
                        $ref: "#/components/schemas/SyncChanges"
                      moments:
                        $ref: "#/components/schemas/SyncChanges"
                      milestones:
                        $ref: "#/components/schemas/SyncChanges"
                  timestamp:
                    type: integer
                    description: Server timestamp in milliseconds

  /v1/sync/push:
    post:
      tags: [Sync]
      summary: Push changes to server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: object
                  properties:
                    kids:
                      type: object
                      properties:
                        created:
                          type: array
                        updated:
                          type: array
                        deleted:
                          type: array
                lastPulledAt:
                  type: integer
      responses:
        "200":
          description: Changes applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
