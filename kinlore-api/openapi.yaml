          description: Media list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /v1/media/{media}:
