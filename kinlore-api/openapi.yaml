openapi: 3.0.3
info:
  title: Kinlore API
  description: Family moments and milestones tracking API
  version: 1.0.0
  contact:
    name: Kinlore
servers:
  - url: http://localhost:8000/api
    description: Local development
  - url: https://api.kinlore.com/api
    description: Production

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Kids
    description: Child profile management
  - name: Invitations
    description: Admin-only invitations to join this instance
  - name: Moments
    description: Unified moments (photo, video, story, milestone)
  - name: Media
    description: Raw media file management
  - name: Milestones
    description: Predefined milestone library
  - name: Interactions
    description: Moment likes and comments
  - name: Sync
    description: WatermelonDB synchronization
  - name: Health
    description: Health check endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        is_admin:
          type: boolean
          description: True for the instance admin (the first user who registered)
        created_at:
          type: string
          format: date-time

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
          description: When set, only this email can use the invitation
        invited_by:
          type: integer
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Kid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        date_of_birth:
          type: string
          format: date
        avatar_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        age:
          type: string
        age_detailed:
          type: string
        moments_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Moment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        moment_type:
          type: string
          enum: [photo, video, story, milestone]
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: Required for story type, optional for milestone type
        milestone_id:
          type: string
          nullable: true
          description: Reference to milestones.id (required for milestone type)
        photo_url:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        medium_url:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
        mime_type:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        exif_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [photo, video]
        status:
          type: string
          enum: [uploading, processing, completed, failed]
        original_filename:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        thumbnail_url:
          type: string
          nullable: true
        medium_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Story:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        title:
          type: string
        text:
          type: string
        icon_image_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    Milestone:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        stage_key:
          type: string
        stage_label:
          type: string
        age_min_months:
          type: integer
        age_max_months:
          type: integer
        category:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserMilestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        milestone_id:
          type: string
          nullable: true
        custom_title:
          type: string
          nullable: true
        custom_description:
          type: string
          nullable: true
        milestone_date:
          type: string
          format: date
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        moment_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [comment]
        content:
          type: string
        user:
          $ref: "#/components/schemas/User"
        created_at:
          type: string
          format: date-time

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
        error:
          type: string
          nullable: true
      required:
        - success
        - message

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          required:
            - errors

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    SyncChanges:
      type: object
      properties:
        created:
          type: array
          items:
            type: object
        updated:
          type: array
          items:
            type: object
        deleted:
          type: array
          items:
            type: string
            description: IDs of deleted records

    SyncMoment:
      type: object
      description: Moment data as returned by sync endpoint (timestamps in milliseconds)
      properties:
        id:
          type: string
          format: uuid
        kid_id:
          type: string
          format: uuid
        moment_type:
          type: string
          enum: [photo, video, story, milestone]
        milestone_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        photo_url:
          type: string
          nullable: true
        medium_url:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
        mime_type:
          type: string
          nullable: true
        exif_date:
          type: integer
          nullable: true
          description: Timestamp in milliseconds
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        created_at:
          type: integer
          description: Timestamp in milliseconds
        updated_at:
          type: integer
          description: Timestamp in milliseconds

    SyncMilestone:
      type: object
      description: Milestone data as returned by sync endpoint (timestamps in milliseconds)
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        stage_key:
          type: string
        stage_label:
          type: string
        age_min_months:
          type: integer
          nullable: true
        age_max_months:
          type: integer
          nullable: true
        sort_order:
          type: integer
        created_at:
          type: integer
          description: Timestamp in milliseconds
        updated_at:
          type: integer
          description: Timestamp in milliseconds

    SyncKid:
      type: object
      description: Kid data as returned by sync endpoint (timestamps in milliseconds)
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        date_of_birth:
          type: integer
          description: Timestamp in milliseconds
        avatar_color:
          type: string
        created_at:
          type: integer
          description: Timestamp in milliseconds
        updated_at:
          type: integer
          description: Timestamp in milliseconds

paths:
  # ============================================================================
  # HEALTH
  # ============================================================================
  /health:
    get:
      tags: [Health]
      summary: Basic health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  service:
                    type: string
                    example: kinlore-api

  /health/detailed:
    get:
      tags: [Health]
      summary: Detailed health check
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Detailed health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: object
                  storage:
                    type: object
                  queue:
                    type: object

  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      description: |
        The first user to register becomes the instance admin and needs no invitation.
        Every later user must send a valid `invite_token` created by the admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                invite_token:
                  type: string
                  description: Required for everyone except the first user
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
        "422":
          description: Validation error, including a missing, used, expired or wrong-email invite_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
                      token_type:
                        type: string
        "422":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke current token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout from all devices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out from all devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      is_admin:
                        type: boolean
                      email_verified_at:
                        type: string
                        format: date-time
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                      kids_count:
                        type: integer
                      moments_count:
                        type: integer
                      storage_used:
                        type: string
                      storage_bytes_used:
                        type: integer
                      storage_bytes_available:
                        type: integer

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      token_type:
                        type: string

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        is_current:
                          type: boolean
                        last_used_at:
                          type: string
                          format: date-time

  /auth/sessions/{tokenId}:
    delete:
      tags: [Auth]
      summary: Revoke specific session
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================================
  # KIDS
  # ============================================================================
  /v1/kids:
    get:
      tags: [Kids]
      summary: List kids
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kids list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Kid"

    post:
      tags: [Kids]
      summary: Create kid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, date_of_birth]
              properties:
                name:
                  type: string
                  example: Emma
                date_of_birth:
                  type: string
                  format: date
                  example: "2022-03-15"
                avatar_color:
                  type: string
                  pattern: "^#[0-9A-Fa-f]{6}$"
                  example: "#FF6B6B"
      responses:
        "201":
          description: Kid created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Kid"

  /v1/kids/{kid}:
    get:
      tags: [Kids]
      summary: Get kid details
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Kid details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Kid"

    put:
      tags: [Kids]
      summary: Update kid
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                date_of_birth:
                  type: string
                  format: date
                avatar_color:
                  type: string
      responses:
        "200":
          description: Kid updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Kid"

    delete:
      tags: [Kids]
      summary: Delete kid
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Kid deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ============================================================================
  # UNIFIED MOMENTS
  # ============================================================================
  /v1/moments:
    get:
      tags: [Moments]
      summary: List moments
      security:
        - bearerAuth: []
      parameters:
        - name: kid_id
          in: query
          schema:
            type: string
            format: uuid
        - name: moment_type
          in: query
          schema:
            type: string
            enum: [photo, video, story, milestone]
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Moments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Moment"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

    post:
      tags: [Moments]
      summary: Create moment (unified - photo, video, story, or milestone)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kid_id]
              properties:
                kid_id:
                  type: string
                  format: uuid
                moment_type:
                  type: string
                  enum: [photo, video, story, milestone]
                  description: Auto-detected for file uploads
                file:
                  type: string
                  format: binary
                  description: Required for photo/video types
                title:
                  type: string
                description:
                  type: string
                  description: Required for story type, optional for milestone type
                milestone_id:
                  type: string
                  description: Required for milestone type (references milestones.id)
                device_asset_id:
                  type: string
                exif_date:
                  type: string
                  format: date-time
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                camera_make:
                  type: string
                camera_model:
                  type: string
                orientation:
                  type: integer
                  minimum: 1
                  maximum: 8
      responses:
        "201":
          description: Moment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      moment:
                        $ref: "#/components/schemas/Moment"
                      media:
                        $ref: "#/components/schemas/Media"
                        description: Only included for photo/video types
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /v1/moments/{moment}:
    get:
      tags: [Moments]
      summary: Get moment details
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Moment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Moment"

    put:
      tags: [Moments]
      summary: Update moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                text:
                  type: string
                  description: For story type
                custom_title:
                  type: string
                  description: For milestone type
                milestone_date:
                  type: string
                  format: date
                notes:
                  type: string
      responses:
        "200":
          description: Moment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Moment"

    delete:
      tags: [Moments]
      summary: Delete moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Moment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/moments/{moment}/file/{type}:
    get:
      tags: [Moments]
      summary: Serve moment file (authenticated)
      description: |
        Serves moment files with authentication. For streaming video via HLS, use `/file/hls` instead (no auth required).
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [original, medium, thumbnail]
          description: |
            - `original`: Original uploaded file (photo/video) - requires auth
            - `medium`: Medium resolution image (1200px width) - requires auth
            - `thumbnail`: Thumbnail image (300x300) - requires auth
      responses:
        "200":
          description: File content
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/moments/{moment}/file/hls:
    get:
      tags: [Moments]
      summary: Serve HLS master playlist (public, no auth)
      description: |
        Serves the HLS master playlist for video streaming. **No authentication required.**
        iOS/Android video players cannot inject auth headers, so HLS streaming is public.
      security: [] # No authentication required
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: HLS master playlist
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: "*"
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                description: HLS master playlist content
              example: |
                #EXTM3U
                #EXT-X-VERSION:3
                #EXT-X-STREAM-INF:BANDWIDTH=2500000,RESOLUTION=1280x720
                playlist_0_2500.m3u8
                #EXT-X-STREAM-INF:BANDWIDTH=1000000,RESOLUTION=854x480
                playlist_1_1000.m3u8
        "404":
          description: HLS not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/moments/{moment}/file/{filename}:
    get:
      tags: [Moments]
      summary: Serve HLS segment file (public, no auth)
      description: |
        Serves individual HLS variant playlists and segment files. **No authentication required.**
        This endpoint is called by HLS video players after loading the master playlist.

        **Filename patterns:**
        - Variant playlists: `playlist_0_2500.m3u8`, `playlist_1_1000.m3u8`
        - Segment files: `playlist_0_00001.ts`, `playlist_1_00002.ts`
      security: [] # No authentication required
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '.*\.(m3u8|ts)$'
          examples:
            variant_playlist:
              value: "playlist_0_2500.m3u8"
              summary: Variant playlist for 720p quality
            segment:
              value: "playlist_0_00001.ts"
              summary: Video segment file
      responses:
        "200":
          description: HLS file content
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                description: Variant playlist content (.m3u8)
              example: |
                #EXTM3U
                #EXT-X-VERSION:3
                #EXT-X-TARGETDURATION:10
                #EXTINF:10.0,
                playlist_0_00001.ts
                #EXTINF:10.0,
                playlist_0_00002.ts
            video/MP2T:
              schema:
                type: string
                format: binary
                description: Video segment file (.ts)
        "404":
          description: HLS file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/moments/{moment}/file-status:
    get:
      tags: [Moments]
      summary: Check file status (diagnostic)
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      moment_id:
                        type: string
                      paths:
                        type: object
                      exists:
                        type: object

  /v1/kids/{kid}/moments/uploaded-identifiers:
    get:
      tags: [Moments]
      summary: Get uploaded identifiers for duplicate detection
      security:
        - bearerAuth: []
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Uploaded identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_asset_id:
                          type: string
                        device_fingerprint:
                          type: string
                        file_size:
                          type: integer
                        filename:
                          type: string

  # ============================================================================
  # INTERACTIONS
  # ============================================================================
  /v1/moments/{moment}/like:
