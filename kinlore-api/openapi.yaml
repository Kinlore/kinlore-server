      tags: [Interactions]
      summary: Like a moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Moment liked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "200":
          description: Already liked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

    delete:
      tags: [Interactions]
      summary: Unlike a moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Moment unliked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not liked yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/moments/{moment}/comments:
    get:
      tags: [Interactions]
      summary: Get comments for moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"

    post:
      tags: [Interactions]
      summary: Add comment to moment
      security:
        - bearerAuth: []
      parameters:
        - name: moment
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Comment"

  /v1/interactions/{interaction}:
    delete:
      tags: [Interactions]
      summary: Delete comment
      security:
        - bearerAuth: []
      parameters:
        - name: interaction
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid interaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

