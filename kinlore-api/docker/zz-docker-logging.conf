; PHP-FPM configuration for Docker logging

; Send PHP-FPM logs to stderr (shows in docker logs)
error_log = /proc/self/fd/2

; Send access logs to stdout
access.log = /proc/self/fd/2

; Log errors to stderr for all workers
catch_workers_output = yes

; Decode worker output (prevents garbled logs)
decorate_workers_output = no

; Also log slow requests (optional, useful for debugging)
; slowlog = /proc/self/fd/2
; request_slowlog_timeout = 5s
