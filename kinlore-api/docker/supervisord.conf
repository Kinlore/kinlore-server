[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; Two workers: a long export does not hold up video conversions, and the reverse
[program:queue-video-processing]
command=php /var/www/html/artisan queue:work --queue=video-processing --tries=3 --timeout=1800 --memory=512
directory=/var/www/html
# ffmpeg parses uploaded videos; never as root, and files it writes in storage stay writable for PHP-FPM
user=www-data
# a redeploy lets a running video or export job finish
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
numprocs=1
startretries=3

[program:queue-default]
command=php /var/www/html/artisan queue:work --queue=default --tries=3 --timeout=3600 --memory=512
directory=/var/www/html
# exports; never as root, and files it writes in storage stay writable for PHP-FPM
user=www-data
# a redeploy lets a running video or export job finish
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
numprocs=1
startretries=3
