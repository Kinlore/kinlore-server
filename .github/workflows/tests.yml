name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Unit and feature tests. Includes OpenApiRoutesTest: openapi.yaml must list exactly the server's routes.
  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    # 8.5 is the supported version. 8.6 is a look ahead: Laravel 13 does not list it yet, so it may fail.
    continue-on-error: ${{ matrix.php == '8.6' }}
    name: api (PHP ${{ matrix.php }})
    defaults:
      run:
        working-directory: kinlore-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, exif, zip, intl, mbstring, bcmath
      - run: sudo apt-get update && sudo apt-get install -y libheif-examples   # heif-dec for the HEIC preview test
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  # The Docker stack of docs/self-hosting/docker.md, in both web server modes
  docker:
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_PASSWORD: ci-only-password
      SEAWEEDFS_KEY: ci-only-key
      SEAWEEDFS_SECRET: ci-only-secret
      SEED_USER_EMAIL: admin@example.test
      SEED_USER_PASSWORD: CiOnly-12345
    steps:
      - uses: actions/checkout@v4
      - name: Plain HTTP mode (for your own reverse proxy)
        env:
          APP_URL: http://localhost:28461
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          curl -fsS http://localhost:28461/api/health
          scripts/smoke-test.sh http://localhost:28461 "$SEED_USER_EMAIL" "$SEED_USER_PASSWORD"
      - name: Links use https behind a trusted proxy
        run: |
          sleep 61   # sign-in limit: 5 per minute
          # setup_url comes from APP_URL; the redirect of /setup follows the proxy headers
          curl -sS -o /dev/null -D - -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: photos.example.com' \
            http://localhost:28461/setup | grep -qi '^location: https://photos.example.com'
      - name: Built-in HTTPS mode (KINLORE_DOMAIN)
        env:
          APP_URL: https://localhost
          KINLORE_DOMAIN: localhost
          APP_PORT: 80
          APP_SSL_PORT: 443
        run: |
          docker compose up -d --wait --wait-timeout 300
          curl -fsSk https://localhost/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/health)" = 308
      - name: Reverse proxy and data folder (deploy/docker)
        env:
          APP_URL: http://127.0.0.1:28461
          COMPOSE_FILE: docker-compose.yml:deploy/docker/reverse-proxy.yml:deploy/docker/bind-mounts.yml
          DATA_LOCATION: ${{ runner.temp }}/kinlore-data
        run: |
          docker compose down   # the network gets a new subnet; containers must join it again
          docker compose up -d --wait --wait-timeout 300
          test -d "$DATA_LOCATION/postgres/18/docker"
          test "$(docker network inspect "$(basename "$PWD")_kinlore-network" --format '{{(index .IPAM.Config 0).Gateway}}')" = 172.31.250.1
          scripts/smoke-test.sh http://127.0.0.1:28461 "$SEED_USER_EMAIL" "$SEED_USER_PASSWORD"
          # a proxy on the host reaches the API from the gateway, which this file trusts
          curl -sS -o /dev/null -D - -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: photos.example.com' \
            http://127.0.0.1:28461/setup | grep -qi '^location: https://photos.example.com'
      - if: failure()
        run: docker compose logs --tail 80 api

  # The host install of docs/self-hosting/bare-metal.md, on a clean Debian, with Caddy and with nginx
  bare-metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-bare-metal.sh
