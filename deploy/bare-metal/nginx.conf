# Kinlore on a host without Docker: nginx in front of PHP-FPM.
# Copy to /etc/nginx/sites-available/kinlore, set server_name, link it into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: run "sudo certbot --nginx -d photos.example.com" afterwards; certbot adds the TLS lines.
server {
    listen 80;
    listen [::]:80;
    server_name photos.example.com;
    root /srv/kinlore/kinlore-api/public;
    index index.php;
    charset utf-8;

    # PHP limits the upload size (php-kinlore.ini)
    client_max_body_size 0;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_hide_header X-Powered-By;

        # Send large files (originals, exports) straight to the client; never spool them to a temp file
        fastcgi_buffering off;
        fastcgi_request_buffering off;

        # Long videos and exports
        fastcgi_read_timeout 1800;
        fastcgi_send_timeout 1800;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
