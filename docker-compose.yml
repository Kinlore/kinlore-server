services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: kinlore-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kinlore_db}
      POSTGRES_USER: ${DB_USERNAME:-kinlore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kinlore_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-kinlore_user} -d ${DB_DATABASE:-kinlore_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kinlore-network

  # SeaweedFS Object Storage (S3-Compatible)
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: kinlore-seaweedfs-master
    restart: unless-stopped
    command: master -ip=seaweedfs-master -ip.bind=0.0.0.0 -metricsPort=9324
    ports:
      - "9333:9333"
      - "19333:19333"
    volumes:
      - seaweedfs_master:/data
    networks:
      - kinlore-network

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: kinlore-seaweedfs-volume
    restart: unless-stopped
    command: volume -mserver="seaweedfs-master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325
    ports:
      - "8080:8080"
      - "18080:18080"
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      - seaweedfs-master
    networks:
      - kinlore-network

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: kinlore-seaweedfs-filer
    restart: unless-stopped
    command: filer -master="seaweedfs-master:9333" -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
    ports:
      - "8888:8888"
      - "8333:8333"
      - "18888:18888"
    volumes:
      - seaweedfs_filer:/data
      - ./kinlore-api/docker/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - kinlore-network

  # Laravel API (Apache + mod_php)
  api:
    build:
      context: ./kinlore-api
      dockerfile: Dockerfile
    container_name: kinlore-api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./kinlore-api/.env
    environment:
      # App Configuration
      APP_NAME: ${APP_NAME:-Kinlore}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}

      # Database Configuration
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: kinlore-postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-kinlore_db}
      DB_USERNAME: ${DB_USERNAME:-kinlore_user}
      DB_PASSWORD: ${DB_PASSWORD:-kinlore_password}

      # SeaweedFS S3 Configuration
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-seaweedfs}
      SEAWEEDFS_ENDPOINT: http://seaweedfs-filer:8333
      SEAWEEDFS_KEY: ${SEAWEEDFS_KEY:-admin}
      SEAWEEDFS_SECRET: ${SEAWEEDFS_SECRET:-admin}
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-kinlore}
      SEAWEEDFS_USE_PATH_STYLE_ENDPOINT: "true"
      SEAWEEDFS_URL: ${SEAWEEDFS_URL:-http://localhost:8333}

      # Cache & Session
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}

      # Sanctum
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8081}

      # Logging
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      # Initial User Seeding (only used on first run)
      SEED_USER_NAME: ${SEED_USER_NAME:-Admin}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    volumes:
      # Persistent storage for uploads and Laravel storage
      - api_storage:/var/www/html/storage
      # Webroot for ACME challenge files
      - certbot_www:/var/www/certbot:ro
      # SSL certificates from certbot
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-filer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kinlore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Renewal loop (runs forever, renews twice/day)
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"
    restart: unless-stopped
  redis:
    image: redis:alpine
    container_name: kinlore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kinlore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  kinlore-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  seaweedfs_master:
    driver: local
  seaweedfs_volume:
    driver: local
  seaweedfs_filer:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
  certbot_www:
    driver: local
  letsencrypt:
    driver: local
